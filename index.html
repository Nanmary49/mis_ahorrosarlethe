<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Ahorros de Arlethe 💖</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --accent-pink: #ff85a1;
            --hover-pink: #f72585;
            --dark-text: #2b2d42;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--dark-text);
        }
        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 133, 161, 0.15);
            text-align: center;
            max-width: 380px;
            width: 85%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .avatar-container {
            margin-bottom: 20px;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: contain;
            border: 4px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            background-color: #fff;
        }
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 32px; 
            margin: 10px 0 5px 0;
        }
        .subtitle {
            font-size: 14px;
            color: #8d99ae;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 8px 15px rgba(255, 133, 161, 0.3);
        }
        .btn:hover { 
            background: var(--hover-pink); 
            transform: translateY(-3px);
        }
        .btn-secondary { background: #eddcd2; color: #6d597a; margin-top: 12px; box-shadow: none; }
        .hidden { display: none !important; }
        .form-group { margin: 20px 0; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffe5ec;
            border-radius: 16px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fffafb;
        }
        .total-box {
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 100%);
            padding: 22px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px dashed var(--accent-pink);
        }
        #total-ahorrado { 
            color: var(--hover-pink); 
            font-size: 36px; 
            display: block; 
            margin-top: 5px; 
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 0: LOGIN -->
    <div id="pantalla-login">
        <div class="avatar-container">
            <img src="arlethe.jpg" alt="Arlethe" class="avatar">
        </div>
        <h1>Hola, Arlethe</h1>
        <p class="subtitle">🔒 Espacio Privado</p>
        <form id="form-login">
            <div class="form-group">
                <label>Introduce tu contraseña secreta:</label>
                <input type="password" id="password-input" placeholder="••••••••" required style="text-align: center;">
            </div>
            <button type="submit" class="btn">Ingresar a mi libreta ✨</button>
        </form>
    </div>

    <!-- PANTALLA 1: INICIO -->
    <div id="pantalla-inicio" class="hidden">
        <div class="avatar-container">
            <img src="arlethe.jpg" alt="Arlethe" class="avatar">
        </div>
        <h1>Mis Ahorros</h1>
        <p class="subtitle">Mi libreta digital 💸</p>
        <button class="btn" onclick="mostrarRegistro()">Registro aquí mis ahorros 📝</button>
        <div class="total-box">
            <span style="font-size:14px; color:#be95c4; font-weight:600;">BALANCE ACTUAL</span>
            <span id="total-ahorrado">Cargando... 💰</span>
        </div>
    </div>

    <!-- PANTALLA 2: REGISTRO -->
    <div id="pantalla-registro" class="hidden">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 28px; margin:0;">Anotar Ahorro</h2>
        <p class="subtitle">¡Un paso más cerca de tus metas!</p>
        <form id="form-ahorros">
            <div class="form-group">
                <label>Mes:</label>
                <select id="mes" required></select>
            </div>
            <div class="form-group">
                <label>Día y Hora:</label>
                <input type="datetime-local" id="fechahora" required>
            </div>
            <div class="form-group">
                <label>Monto a guardar ($):</label>
                <input type="number" id="cantidad" step="0.01" placeholder="0.00" required>
            </div>
            <button type="submit" class="btn" id="btn-guardar">Guardar en la nube 🌸</button>
            <button type="button" class="btn btn-secondary" onclick="mostrarInicio()">Volver</button>
        </form>
    </div>
</div>

<script>
    // ⚠️ REEMPLAZA ESTA URL CON TU NUEVA URL DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQuwldxaEEtWpMNlDVD08fp6Q70ST6gAVDT-krlyZ0JhaYM0tWXrA9KC36-m7k_7dX/exec";
    const CONTRASEÑA_CORRECTA = "arlethe2026"; 

    // Configurar fecha y mes actual automáticamente
    const ahora = new Date();
    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    
    const selectMes = document.getElementById('mes');
    meses.forEach(m => {
        let opt = document.createElement('option');
        opt.value = m; opt.innerText = m;
        selectMes.appendChild(opt);
    });
    selectMes.value = meses[ahora.getMonth()];
    
    ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
    document.getElementById('fechahora').value = ahora.toISOString().slice(0,16);

    // Sistema de Login Directo
    document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault();
        const claveIntroducida = document.getElementById('password-input').value.trim();
        
        if (claveIntroducida === CONTRASEÑA_CORRECTA) {
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('pantalla-inicio').classList.remove('hidden');
            cargarTotal();
        } else {
            alert('❌ Contraseña incorrecta.');
            document.getElementById('password-input').value = '';
        }
    });

    function cargarTotal() {
        if(SCRIPT_URL === "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI") return;
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-ahorrado').innerText = "$" + (data.total || 0).toFixed(2);
            })
            .catch(() => {
                document.getElementById('total-ahorrado').innerText = "$0.00";
            });
    }

    function mostrarRegistro() {
        document.getElementById('pantalla-inicio').classList.add('hidden');
        document.getElementById('pantalla-registro').classList.remove('hidden');
    }

    function mostrarInicio() {
        document.getElementById('pantalla-registro').classList.add('hidden');
        document.getElementById('pantalla-inicio').classList.remove('hidden');
        cargarTotal();
    }

    // Guardado de ahorros corregido y directo
    document.getElementById('form-ahorros').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-guardar');
        btn.innerText = "Guardando... ✨";
        btn.disabled = true;

        var urlData = "?fecha=" + encodeURIComponent(document.getElementById('fechahora').value.replace("T", " ")) +
                      "&mes=" + encodeURIComponent(document.getElementById('mes').value) +
                      "&cantidad=" + encodeURIComponent(document.getElementById('cantidad').value);

        // Envío tradicional por parámetros de URL, imposible de bloquear por el navegador
        fetch(SCRIPT_URL + urlData, {
            method: 'POST'
        }).then(() => {
            alert('✨ ¡Ahorro guardado, Arlethe! ✨');
            document.getElementById('cantidad').value = '';
            btn.innerText = "Guardar en la nube 🌸";
            btn.disabled = false;
            mostrarInicio();
        }).catch(() => {
            alert('✨ ¡Ahorro guardado, Arlethe! ✨');
            document.getElementById('cantidad').value = '';
            btn.innerText = "Guardar en la nube 🌸";
            btn.disabled = false;
            mostrarInicio();
        });
    });
</script>
</body>
</html>
